name: Moonoh Daily Market Snapshot & Historical Persistence

on:
  schedule:
    # Runs every day at 05:00 UTC (1:00 AM EDT / midnight EST)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  capture-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record Daily Historical Market Snapshot
        run: node moonoh-site/scripts/record_daily_snapshot.mjs

      - name: Commit and Push Updated Snapshot Records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add moonoh-site/data/historical_market_snapshots.json
          if git diff --staged --quiet; then
            echo "No new changes to commit for today's snapshot."
          else
            git commit -m "chore(data): record daily historical market snapshot for $(date -u +'%Y-%m-%d') [skip ci]"
            git push origin main
          fi
