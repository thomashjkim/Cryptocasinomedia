name: Daily Wire News Automated Publishing

on:
  schedule:
    # 9:05 AM EDT (13:05 UTC) primary - avoids top-of-hour congestion drop
    - cron: '5 13 * * *'
    # 9:20 AM EDT (13:20 UTC) fallback retry if GitHub drops 9:05
    - cron: '20 13 * * *'
    # 9:35 AM EDT (13:35 UTC) second fallback retry
    - cron: '35 13 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  publish_daily_wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install Pillow requests

      - name: Run Automated Wire Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/auto_publish_daily_wire.py

      - name: Commit & Push to Main
        run: |
          git config --global user.name "TK"
          git config --global user.email "tk@eznewswire.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily wire publication [skip ci]" --author="TK <tk@eznewswire.com>" && git push origin main)

      - name: Trigger Vercel Production Deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -s -X POST "$VERCEL_DEPLOY_HOOK"

