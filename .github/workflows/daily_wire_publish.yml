name: Daily Wire News Automated Publishing

on:
  schedule:
    # 9:00 AM EDT (13:00 UTC) / 9:00 AM EST (14:00 UTC)
    # Cron runs daily at 13:00 UTC (9:00 AM U.S. Eastern Daylight Time)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  publish_daily_wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install Pillow requests

      - name: Set up Node.js & Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Run Automated Wire Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/auto_publish_daily_wire.py

      - name: Commit & Push to Main
        run: |
          git config --global user.name "TK"
          git config --global user.email "tk@eznewswire.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily wire publication [skip ci]" --author="TK <tk@eznewswire.com>" && git push origin main)

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel --prod --cwd index --yes --token=$VERCEL_TOKEN
