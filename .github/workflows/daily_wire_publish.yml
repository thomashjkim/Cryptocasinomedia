name: Daily Wire News Automated Publishing

on:
  schedule:
    # High-reliability multi-tier schedule to overcome GitHub Actions free-tier runner queue delays
    # Triggers at 8:15 AM, 8:45 AM, 9:15 AM, 9:45 AM, and 10:15 AM EST
    # auto_publish_daily_wire.py checks daily quota and skips if already fulfilled
    - cron: '15 13 * * *'
    - cron: '45 13 * * *'
    - cron: '15 14 * * *'
    - cron: '45 14 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  publish_daily_wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install Pillow requests

      - name: Run Automated Wire Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/auto_publish_daily_wire.py

      - name: Commit & Push to Main
        run: |
          git config --global user.name "TK"
          git config --global user.email "tk@eznewswire.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(auto): daily wire publication" --author="TK <tk@eznewswire.com>" && git push origin main)

      - name: Trigger Vercel Production Deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK"
          fi
