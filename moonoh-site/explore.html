  <style>
    /* UNIFIED CONTENT ALIGNMENT & AIRBNB UI SYSTEM */
    :root {
      --moonoh-dark: #1E1B4B;
      --moonoh-primary: #4F46E5;
      --moonoh-light-bg: #FAF9FF;
      --moonoh-card-bg: #FFFFFF;
      --moonoh-pill-bg: #F5F3FF;
      --moonoh-pill-border: #DDD6FE;
      --text-main: #222222;
      --text-muted: #717171;
      --airbnb-border: #EBEBEB;
      --airbnb-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      --airbnb-shadow-hover: 0 14px 32px rgba(31, 27, 75, 0.09);
      --radius-airbnb: 20px;
      --radius-pill: 9999px;
      --container-max-width: 940px;
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; background-color: var(--moonoh-light-bg); color: var(--text-main); }

    /* === NAVBAR LINK THEME OVERRIDES (moonoh violet, all breakpoints) === */
    .navbar-link.w-nav-link,
    a.navbar-link {
      color: #1A1A1A !important;
      font-weight: 500 !important;
      transition: color 0.15s ease, font-weight 0.1s ease !important;
    }
    .navbar-link.w-nav-link:hover,
    .navbar-link.w-nav-link:focus,
    a.navbar-link:hover,
    a.navbar-link:focus {
      color: #4F46E5 !important;
      font-weight: 700 !important;
    }
    .navbar-link.w-nav-link.w--current,
    a.navbar-link.w--current {
      color: #4F46E5 !important;
      font-weight: 700 !important;
    }

    /* UNIFIED CONTAINER ALIGNMENT ACROSS ALL SECTIONS */
    .hero-heading-left .container,
    .tldr-box,
    .comparison-section,
    .faq-section,
    .footer .columns,
    .page-container {
      max-width: var(--container-max-width) !important;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 20px !important;
      padding-right: 20px !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    /* Vertical Section Spacing */
    .tldr-box,
    .team-circles,
    .comparison-section,
    .faq-section {
      margin-top: 64px !important;
      margin-bottom: 64px !important;
    }


    /* Airbnb Card Styling with Pixel-Perfect Alignment */
    .tldr-box, .content-box, .faq-item, .media-card, .team-card, .contact-info-card {
      background: var(--moonoh-card-bg);
      border: 1px solid var(--airbnb-border);
      border-radius: var(--radius-airbnb);
      box-shadow: var(--airbnb-shadow);
      padding: 32px;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s cubic-bezier(0.2, 0, 0, 1), border-color 0.25s ease;
    }

    .tldr-box:hover, .faq-item:hover, .content-box:hover, .media-card:hover, .team-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--airbnb-shadow-hover);
      border-color: #C7D2FE;
    }

    /* Airbnb Pill Badge (Moonoh Violet) */
    .tldr-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--moonoh-pill-bg);
      color: var(--moonoh-primary);
      border: 1px solid var(--moonoh-pill-border);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
    }

    .tldr-box p {
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.75;
      margin: 0;
      font-weight: 450;
    }
    .tldr-box p strong {
      color: var(--moonoh-dark);
      font-weight: 700;
    }

    /* Section Headings Left Alignment */
    .page-title, .comparison-section h2, .faq-section h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--moonoh-dark);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .comparison-section p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Comparison Table (Airbnb Minimal Table) */
    .table-responsive-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius-airbnb);
      border: 1px solid var(--airbnb-border);
      box-shadow: var(--airbnb-shadow);
      background: #FFFFFF;
      margin-top: 16px;
    }
    .comparison-table {
      width: 100%;
      min-width: 540px;
      border-collapse: collapse;
      background: #FFFFFF;
    }
    .comparison-table th {
      background: #FAF9FF;
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 800;
      color: var(--moonoh-dark);
      border-bottom: 1px solid var(--airbnb-border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-align: left;
    }
    .comparison-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #F3F4F6;
      font-size: 13px;
      color: var(--text-main);
      white-space: nowrap;
    }
    .comparison-table tr:last-child td { border-bottom: none; }
    .comparison-table td strong { color: var(--moonoh-dark); font-weight: 700; }

    /* FAQ Airbnb Cards */
    .faq-item {
      padding: 24px 28px;
      margin-bottom: 16px;
    }
    .faq-item h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--moonoh-dark);
      margin: 0 0 8px 0;
    }
    .faq-item p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .footer-address { color: var(--text-muted); font-size: 13px; line-height: 1.6; margin-top: 10px; }

    /* Mobile Overrides */
    @media (max-width: 768px) {
      .hero-heading-left .container,
      .tldr-box,
      .comparison-section,
      .faq-section,
      .footer .columns,
      .page-container {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }
      .tldr-box, .team-circles, .comparison-section, .faq-section {
        margin-top: 36px !important;
        margin-bottom: 36px !important;
      }

      .tldr-box, .content-box, .faq-item {
        padding: 22px 18px !important;
        border-radius: 16px !important;
      }
      .hero-heading-left h1, .title-copy-goes-here-be-awesome {
        font-size: 26px !important;
        line-height: 1.25 !important;
      }
      .actions {
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        gap: 10px !important;
        flex-wrap: wrap !important;
      }
      .actions img, .appstore {
        max-width: 150px !important;
        height: auto !important;
      }
    }
  
    
    /* Mobile Navigation Fixes (<450px) */
    @media (max-width: 450px) {
      .navbar-content {
        position: relative !important;
        width: 100% !important;
        height: 64px !important; /* Fixed height for absolute centering */
        display: block !important;
      }
      .navbar .navbar-brand {
        position: absolute !important;
        left: 16px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        margin: 0 !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
        float: none !important;
      }
      .navbar .logo, .navbar .logo a {
        margin: 0 !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
      }
      .navbar .logo img, .navbar .vectors-wrapper-2 {
        display: block !important;
        max-width: 170px !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .navbar .w-nav-button {
        position: absolute !important;
        right: 16px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        background-color: transparent !important;
        padding: 0 !important;
        width: 48px !important;
        height: 48px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        float: none !important;
      }
      .navbar .w-nav-button.w--open {
        background-color: transparent !important;
      }
      
      /* Hamburger Menu Open State Styling */
      .navbar .w-nav-menu {
        background-color: #FAF9FF !important;
        box-shadow: 0 8px 24px rgba(0,0,0,0.1) !important;
        border-radius: 16px !important;
        padding: 20px !important;
        margin-top: 10px !important;
      }
      .w-nav-overlay {
        background: transparent !important;
        top: 64px !important; /* Start below navbar */
      }
      .navbar-link, .nav-link {
        font-family: "Open Sans", sans-serif !important;
        font-size: 18px !important;
        font-weight: 500 !important;
        color: #1A1A1A !important;
        padding: 16px 20px !important;
        text-align: center !important;
        display: block !important;
        transition: color 0.15s ease !important;
      }
      .navbar-link:hover, .navbar-link:focus, .nav-link:hover, .nav-link:focus {
        color: #4F46E5 !important;
        font-weight: 700 !important;
      }
      .navbar-link.w--current, .nav-link.w--current,
      .navbar-link[aria-current], .nav-link[aria-current] {
        color: #4F46E5 !important;
        font-weight: 700 !important;
      }
      .navbar .navbar-button {
        background-color: #2F3CFF !important;
        color: white !important;
        padding: 16px 24px !important;
        border-radius: 100px !important;
        margin-top: 16px !important;
        display: block !important;
        text-align: center !important;
      }
      .navbar .navbar-button .text, .navbar .navbar-button div {
        font-family: "Open Sans", sans-serif !important;
        font-size: 18px !important;
        font-weight: 800 !important;
        color: white !important;
      }
      
      /* Hamburger Icon toggles to X */
      .navbar .w-nav-button.w--open .w-icon-nav-menu {
        display: none !important;
      }
      @media (max-width: 479px) {
      .navbar .w-nav-button.w--open::after {
        content: "✕" !important;
        font-size: 32px !important;
        color: #1A1A1A !important;
        line-height: 1 !important;
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
      }
    }
    } /* Missing closing brace added here */
    
    /* Dynamic Item Grid & Modal CSS */
    .item-feed-section {
      max-width: var(--container-max-width) !important;
      margin: 96px auto 64px auto !important;
      padding: 0 20px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .item-feed-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--moonoh-dark);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }
    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .item-card {
      background: transparent;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      animation: fadeInCard 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .item-card:hover {
      transform: translateY(-4px);
    }
                /* Unbreakable 1:1 Square Card Box CSS */
    .item-card-img-wrap {
      width: 100% !important;
      max-width: 100% !important;
      height: 0 !important;
      padding-bottom: 100% !important;
      position: relative !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      background-color: #F3F4F6 !important;
      margin-bottom: 8px !important;
      display: block !important;
    }
    .item-card-img-wrap img,
    .item-card-image,
    .item-card-img {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: cover !important;
      border-radius: 12px !important;
      display: block !important;
      margin: 0 !important;
    }
    .item-card-content,
    .item-card-info {
      padding: 4px 4px 0 4px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .item-card-price {
      font-weight: 800;
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .item-card-title {
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .item-card-location {
      font-size: 13px;
      color: #717171;
    }
    
    /* Location Dropdown */
    .location-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .location-select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    #location-select {
      appearance: none;
      -webkit-appearance: none;
      padding: 9px 36px 9px 16px;
      border-radius: 999px;
      border: 1.5px solid #3a46e2;
      font-size: 14px;
      font-weight: 600;
      color: #3a46e2;
      background: #EDEFFC;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      min-width: 180px;
    }
    #location-select:hover {
      background: #D9DCF9;
    }
    .location-select-caret {
      position: absolute;
      right: 12px;
      pointer-events: none;
      color: #4F46E5;
    }
    .location-count {
      font-size: 13px;
      color: #6B7280;
      font-weight: 500;
      min-width: 90px;
      display: inline-block;
    }

    /* Filter Pills (Multi-line Wrap, Compact Size, 8px Vertical Gap) */
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      row-gap: 8px;
      column-gap: 10px;
      margin-bottom: 28px;
    }
    .filter-pill {
      white-space: nowrap;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #4B5563;
      background-color: #F9FAFB;
      border: 1px solid #E5E7EB;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-pill:focus {
      outline: none;
    }
    .filter-pill.active {
      background-color: #111827;
      color: #FFFFFF;
      border-color: #111827;
      font-weight: 600;
    }
    .filter-pill:hover:not(.active) {
      border-color: #9CA3AF;
      color: #111827;
      background-color: #F3F4F6;
    }
    .filter-pill-extra {
      display: none;
    }
    .filter-container.is-expanded .filter-pill-extra {
      display: inline-block;
    }
    .filter-pill-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .filter-container.is-expanded .filter-pill-more {
      border-color: #9CA3AF;
      color: #111827;
      background-color: #FFFFFF;
    }
    .more-cat-caret {
      transition: transform 0.2s ease;
    }
    .filter-container.is-expanded .more-cat-caret {
      transform: rotate(180deg);
    }
    
    /* Source Segment Switcher (Moonoh · Rescue · Local · Markets) */
    .source-segment-wrap {
      display: inline-flex;
      align-items: center;
      background-color: #F3F4F6;
      padding: 3px;

    function normalizeSearchText(str) {
      if (!str) return '';
      return String(str)
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getItemSearchText(item) {
      if (item._cachedSearchText) return item._cachedSearchText;
      const fields = [
        item.title || '',
        item.brand || '',
        item.badgeName || '',
        item.store_name || '',
        item.sourceName || '',
        item.source || '',
        item.category || item.categoryName || item.primary_category || '',
        item.location || item.townName || item.rawTown || '',
        item.description || item.moonoh_summary || ''
      ];
      item._cachedSearchText = normalizeSearchText(fields.join(' '));
      return item._cachedSearchText;
    }

    function calculateRelevanceScore(item, queryTokens, fullQueryNorm) {
      let score = 0;
      const titleNorm = normalizeSearchText(item.title || '');
      const brandNorm = normalizeSearchText(item.brand || item.store_name || item.badgeName || '');
      const catNorm = normalizeSearchText(item.category || item.categoryName || item.primary_category || '');
      const locNorm = normalizeSearchText(item.location || item.townName || item.rawTown || '');
      const descNorm = normalizeSearchText(item.description || item.moonoh_summary || '');

      if (titleNorm === fullQueryNorm) score += 100;
      else if (titleNorm.startsWith(fullQueryNorm)) score += 60;
      else if (titleNorm.includes(fullQueryNorm)) score += 40;

      for (const token of queryTokens) {
        if (titleNorm.includes(token)) score += 25;
        if (brandNorm.includes(token)) score += 15;
        if (catNorm.includes(token)) score += 10;
        if (locNorm.includes(token)) score += 5;
        if (descNorm.includes(token)) score += 3;
      }
      return score;
    }

    function syncUrlAndSeo() {
      try {
        const urlObj = new URL(window.location.href);
        
        // 1. Tab parameter
        const tabParam = activeSource === 'localshops' ? 'local' : activeSource;
        if (tabParam && tabParam !== 'moonoh') urlObj.searchParams.set('tab', tabParam);
        else urlObj.searchParams.delete('tab');

        // 2. Query parameter
        if (currentSearchQuery) urlObj.searchParams.set('q', currentSearchQuery);
        else urlObj.searchParams.delete('q');

        // 3. Category parameter
        const currentCat = (activeSource === 'localshops') ? activeLocalCategory : getActiveCategoryKeyword();
        if (currentCat && currentCat.toLowerCase() !== 'all') urlObj.searchParams.set('category', currentCat.toLowerCase().replace(/\s+/g, '-'));
        else urlObj.searchParams.delete('category');

        // 4. Sort parameter
        const defaultSortForState = currentSearchQuery ? 'relevance' : 'newest';
        if (currentSortOption && currentSortOption !== defaultSortForState && userHasExplicitSort) {
          urlObj.searchParams.set('sort', currentSortOption);
        } else {
          urlObj.searchParams.delete('sort');
        }

        // 5. Area / Location parameter
        if (activeTown) urlObj.searchParams.set('area', activeTown);
        else urlObj.searchParams.delete('area');

        const newUrlStr = urlObj.pathname + (urlObj.search ? urlObj.search : '');
        window.history.replaceState({
          tab: activeSource,
          q: currentSearchQuery,
          category: currentCat,
          sort: currentSortOption,
          area: activeTown
        }, '', newUrlStr);

        // Update robots meta (noindex for search/filter parameters)
        const hasParams = urlObj.searchParams.toString().length > 0;
        let robotsMeta = document.querySelector('meta[name="robots"]');
        if (robotsMeta) {
          robotsMeta.setAttribute('content', hasParams ? 'noindex, follow' : 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
        }
      } catch (e) {}
    }

            source: p.shop_id,
            shop_id: p.shop_id,
            badgeName: p.brand || (shops[p.shop_id] ? shops[p.shop_id].name : 'Local Shop'),
            url: `/local-product/${p.shop_id}/${p.slug}`,
            source_published_at: p.source_published_at,
            source_created_at: p.source_created_at,
            source_updated_at: p.source_updated_at,
            source_order: p.source_order,
            source_product_id: p.source_product_id,
            moonoh_summary: p.moonoh_summary
          }));
        } else {
          filtered = [...localShopsItemsList];
        }
      } else if (activeSource === 'marketplaces' || activeSource === 'others') {
        filtered = externalItemsList.length > 0 ? [...externalItemsList] : allItems.filter(i => i.source === 'karrot' || i.source === 'heykorean' || i.source === 'external' || String(i.url || '').includes('-ext-'));
      } else {
        // Moonoh tab
        const moonohInAll = allItems.filter(isStrictMoonoh);
        filtered = moonohInAll.length > 0 ? [...moonohInAll] : (moonohItemsList.length > 0 ? [...moonohItemsList] : [...allItems]);
      }

      // 2. Area / Location filter (Preserved on filter clear)
      if (activeTown && boroughKeywords[activeTown]) {
        const kws = boroughKeywords[activeTown];
        filtered = filtered.filter(item => {
          if (item.source === 'kimc') return true;
          const locStr = ((item.rawTown || '') + ' ' + (item.location || '')).toLowerCase();
          return kws.some(kw => locStr.includes(kw));
        });
      }

      // 3. Category filter (for non-local tabs)
      if (activeSource !== 'localshops') {
        if (targetSlug === 'free') {
          filtered = filtered.filter(item => {
            if (!item) return false;
            const p = item.price !== undefined ? item.price : (item.current_price !== undefined ? item.current_price : null);
            if (p === 0 || p === '0' || p === 'Free' || p === 'free') return true;
            const num = parseFloat(p);
            return !isNaN(num) && num === 0;
          });
        } else if (targetSlug && targetSlug !== 'all') {
          filtered = filtered.filter(item => matchesCategory(item.category || item.categoryName, item.title, targetSlug));
        }
      }

      // 4. Search query filter & relevance calculation
      if (currentSearchQuery) {
        const normQuery = normalizeSearchText(currentSearchQuery);
        const queryTokens = normQuery.split(' ').filter(Boolean);
        if (queryTokens.length > 0) {
          filtered = filtered.filter(item => {
            const target = getItemSearchText(item);
            return queryTokens.every(token => target.includes(token));
          });
          // Attach score for relevance sort
          filtered.forEach(item => {
            item._relevanceScore = calculateRelevanceScore(item, queryTokens, normQuery);
          });
        }
      }

      // 5. Sorting
      const effectiveSort = currentSortOption || (currentSearchQuery ? 'relevance' : 'newest');

      if (effectiveSort === 'relevance' && currentSearchQuery) {
        filtered.sort((a, b) => (b._relevanceScore || 0) - (a._relevanceScore || 0));
      } else if (effectiveSort === 'newest') {
        if (activeSource === 'localshops' && !currentSearchQuery && typeof getBalancedLocalProducts === 'function') {
          filtered = getBalancedLocalProducts(filtered, { context: 'explore-local' });
        } else if ((activeSource === 'marketplaces' || activeSource === 'others') && !currentSearchQuery && typeof getBalancedMarketplaceProducts === 'function') {
          filtered = getBalancedMarketplaceProducts(filtered, { context: 'explore-marketplace' });
        } else {
          filtered.sort((a, b) => {
            const dateA = a.source_published_at ? new Date(a.source_published_at).getTime() : (a.postedAt ? new Date(a.postedAt).getTime() : (typeof a.no === 'number' ? a.no : 0));
            const dateB = b.source_published_at ? new Date(b.source_published_at).getTime() : (b.postedAt ? new Date(b.postedAt).getTime() : (typeof b.no === 'number' ? b.no : 0));
            if (dateA !== dateB) return dateB - dateA;
            return (b.no || 0) - (a.no || 0);
          });
        }
      } else if (effectiveSort === 'price-asc') {
        filtered.sort((a, b) => {
          const priceA = (typeof a.price === 'number' && a.price > 0) ? a.price : ((typeof a.current_price === 'number' && a.current_price > 0) ? a.current_price : null);
          const priceB = (typeof b.price === 'number' && b.price > 0) ? b.price : ((typeof b.current_price === 'number' && b.current_price > 0) ? b.current_price : null);
          if (priceA !== null && priceB !== null) return priceA - priceB;
          if (priceA !== null && priceB === null) return -1;
          if (priceA === null && priceB !== null) return 1;
          return 0;
        });
      } else if (effectiveSort === 'price-desc') {
        filtered.sort((a, b) => {
          const priceA = (typeof a.price === 'number' && a.price > 0) ? a.price : ((typeof a.current_price === 'number' && a.current_price > 0) ? a.current_price : null);
          const priceB = (typeof b.price === 'number' && b.price > 0) ? b.price : ((typeof b.current_price === 'number' && b.current_price > 0) ? b.current_price : null);
          if (priceA !== null && priceB !== null) return priceB - priceA;
          if (priceA !== null && priceB === null) return -1;
          if (priceA === null && priceB !== null) return 1;
          return 0;
        });
      }

      currentFiltered = filtered;
      visibleCount = 40;
      renderGrid(currentFiltered);
      updateLocationCount(filtered.length);
      updateResultsLabel(filtered.length);
      updateSearchUI();
      syncUrlAndSeo();

      // Trigger view_search_results if query active
      if (currentSearchQuery && typeof gtag === 'function') {
        gtag('event', 'view_search_results', {
          search_term: currentSearchQuery,
          tab_name: activeSource,
          result_count: filtered.length
        });
      }
    }

          if (Array.isArray(data) && data.length > 0) {
            const list = data.map(raw => ({
              no: raw.id || raw.no,
              id: raw.id || raw.no,

              postedAt: raw.postedAt || raw.no || raw.id

    function initCategoryFromUrl() {
      const params = new URLSearchParams(window.location.search);
      let catParam = params.get('category') || params.get('cat') || params.get('c');
      
      const pathname = window.location.pathname.toLowerCase();
      const parts = pathname.replace(/^\/explore\/?/, '').split('/').filter(Boolean);
      let pathCatSlug = null;
      if (parts.length === 1 && pillSlugToLabel[parts[0]]) {
        pathCatSlug = parts[0];
      } else if (parts.length >= 2 && pillSlugToLabel[parts[1]]) {
        pathCatSlug = parts[1];
      }

      let targetSlug = catParam || pathCatSlug;
      if (targetSlug && pillSlugToLabel[targetSlug.toLowerCase()]) {
        const targetLabel = pillSlugToLabel[targetSlug.toLowerCase()];
        document.querySelectorAll('.filter-pill:not(.filter-pill-more)').forEach(b => {
          if (b.textContent.trim().toLowerCase() === targetLabel.toLowerCase()) {
            b.classList.add('active');

          }

        applyFilters(targetSlug.toLowerCase());

    function setupFilters() {
      const regionToSlug = {
        'Manhattan': 'manhattan',
        'Bronx': 'bronx',
        'Brooklyn': 'brooklyn',
        'Queens': 'queens',
        'Flushing': 'flushing',
        'Bayside': 'bayside',
        'Astoria': 'astoria',
        'Staten Island': 'staten-island',
        'Fort Lee': 'fort-lee-nj',
        'Bergen': 'bergen-county-nj',
        'Hudson': 'hudson-county-nj'
      };

      // Helper to update address bar URL seamlessly without page reload
      function updateAddressBar(newRegionVal, newCatLabel) {
        const regSlug = regionToSlug[newRegionVal] || null;
        const catSlug = pillLabelToSlug[newCatLabel] || null;
        let newUrl = '/explore';
        if (regSlug && catSlug && catSlug !== 'all') {
          newUrl = `/explore/${regSlug}/${catSlug}`;
        } else if (regSlug) {
          newUrl = `/explore/${regSlug}`;
        } else if (catSlug && catSlug !== 'all') {
          newUrl = `/explore/${catSlug}`;
        }
        if (window.location.pathname !== newUrl) {
          window.history.pushState({ path: newUrl }, '', newUrl);
        }
      }

      // Universal Document Click Delegation for Filter Pills & Source Tabs (Guaranteed 100% responsiveness)
      document.addEventListener('click', function(e) {
        const pill = e.target.closest('.filter-pill:not(.filter-pill-more)');
        if (pill) {
          e.preventDefault();
          const label = pill.textContent.trim();
          document.querySelectorAll('.filter-pill:not(.filter-pill-more)').forEach(b => b.classList.remove('active'));
          pill.classList.add('active');

          const slug = pillLabelToSlug[label] || 'all';
          applyFilters(slug);

          const locSel = document.getElementById('location-select');
          const currentRegionVal = locSel ? locSel.value : 'all';
          updateAddressBar(currentRegionVal, label);
          return;
        }

        const tab = e.target.closest('.source-tab-btn');
        if (tab) {
          e.preventDefault();
          const src = tab.getAttribute('data-source') || tab.id.replace('tab-source-', '');
          switchSource(src);
          const urlMap = {
            'moonoh': '/explore',
            'foodrescue': '/explore/food-rescue',
            'localshops': '/explore/local-shops',
            'marketplaces': '/explore/marketplaces'
          };
          if (urlMap[src]) history.pushState(null, '', urlMap[src]);
          return;
        }
      });

      // Location dropdown (smooth instant filtering without hard reload)
      const locationSelect = document.getElementById('location-select');
      if (locationSelect) {
        locationSelect.addEventListener('change', function() {
          activeTown = this.value;
          const activePill = document.querySelector('.filter-pill.active');
          const activeCatLabel = activePill ? activePill.textContent.trim() : 'All';
          
          applyFilters(getActiveCategoryKeyword());
          updateAddressBar(this.value, activeCatLabel);
        });
      }

      let activePath = window.location.pathname.toLowerCase();
      if (activePath.includes('food-rescue') || activePath.includes('foodrescue')) {
        activeSource = 'foodrescue';
      } else if (activePath.includes('local-shops') || activePath.includes('localshops') || activePath.includes('local')) {
        activeSource = 'localshops';
      } else if (activePath.includes('marketplaces') || activePath.includes('others')) {
        activeSource = 'marketplaces';
      } else {
        activeSource = 'moonoh';
      }

      // ALWAYS keep source tabs visible!
      const sourceSegmentWrap = document.getElementById('source-segment-wrap');
      if (sourceSegmentWrap) {
        sourceSegmentWrap.style.display = 'flex';
      }

      switchSource(activeSource);
    }

        });
      }

      const modal = document.getElementById("moonoh-download-modal");
      if (modal) {
        modal.addEventListener("click", function(e) {
          if (e.target === this) closeModal();
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAll);
    } else {
      initAll();
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
      document.querySelectorAll('.navbar-link, .nav-link').forEach(link => {
        const href = link.getAttribute('href');
        if (href) {
          const cleanHref = href.replace(/\/$/, '') || '/';
          const isCurrent = (cleanHref === '/' && currentPath === '/') || (cleanHref !== '/' && currentPath === cleanHref) || (cleanHref !== '/' && cleanHref !== '/explore' && currentPath.startsWith(cleanHref));
          link.classList.toggle('w--current', isCurrent);
          if (isCurrent) {
            link.setAttribute('aria-current', 'page');
            link.style.setProperty('color', '#4F46E5', 'important');
            link.style.setProperty('font-weight', '700', 'important');
          } else {
            link.removeAttribute('aria-current');
            link.style.setProperty('color', '#1A1A1A', 'important');
            link.style.setProperty('font-weight', '500', 'important');
          }
        }
      });
    });
  </script>
</body>
</html>
