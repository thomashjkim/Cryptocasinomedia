  <style>
    /* UNIFIED CONTENT ALIGNMENT & AIRBNB UI SYSTEM */
    :root {
      --moonoh-dark: #1E1B4B;
      --moonoh-primary: #4F46E5;
      --moonoh-light-bg: #FAF9FF;
      --moonoh-card-bg: #FFFFFF;
      --moonoh-pill-bg: #F5F3FF;
      --moonoh-pill-border: #DDD6FE;
      --text-main: #222222;
      --text-muted: #717171;
      --airbnb-border: #EBEBEB;
      --airbnb-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      --airbnb-shadow-hover: 0 14px 32px rgba(31, 27, 75, 0.09);
      --radius-airbnb: 20px;
      --radius-pill: 9999px;
      --container-max-width: 940px;
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; background-color: var(--moonoh-light-bg); color: var(--text-main); }

    /* === NAVBAR LINK THEME OVERRIDES (moonoh violet, all breakpoints) === */
    .navbar-link.w-nav-link,
    a.navbar-link {
      color: #1A1A1A !important;
      font-weight: 500 !important;
      transition: color 0.15s ease, font-weight 0.1s ease !important;
    }
    .navbar-link.w-nav-link:hover,
    .navbar-link.w-nav-link:focus,
    a.navbar-link:hover,
    a.navbar-link:focus {
      color: #4F46E5 !important;
      font-weight: 700 !important;
    }
    .navbar-link.w-nav-link.w--current,
    a.navbar-link.w--current {
      color: #4F46E5 !important;
      font-weight: 700 !important;
    }

    /* UNIFIED CONTAINER ALIGNMENT ACROSS ALL SECTIONS */
    .hero-heading-left .container,
    .tldr-box,
    .comparison-section,
    .faq-section,
    .footer .columns,
    .page-container {
      max-width: var(--container-max-width) !important;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 20px !important;
      padding-right: 20px !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    /* Vertical Section Spacing */
    .tldr-box,
    .team-circles,
    .comparison-section,
    .faq-section {
      margin-top: 64px !important;
      margin-bottom: 64px !important;
    }


    /* Airbnb Card Styling with Pixel-Perfect Alignment */
    .tldr-box, .content-box, .faq-item, .media-card, .team-card, .contact-info-card {
      background: var(--moonoh-card-bg);
      border: 1px solid var(--airbnb-border);
      border-radius: var(--radius-airbnb);
      box-shadow: var(--airbnb-shadow);
      padding: 32px;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s cubic-bezier(0.2, 0, 0, 1), border-color 0.25s ease;
    }

    .tldr-box:hover, .faq-item:hover, .content-box:hover, .media-card:hover, .team-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--airbnb-shadow-hover);
      border-color: #C7D2FE;
    }

    /* Airbnb Pill Badge (Moonoh Violet) */
    .tldr-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--moonoh-pill-bg);
      color: var(--moonoh-primary);
      border: 1px solid var(--moonoh-pill-border);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
    }

    .tldr-box p {
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.75;
      margin: 0;
      font-weight: 450;
    }
    .tldr-box p strong {
      color: var(--moonoh-dark);
      font-weight: 700;
    }

    /* Section Headings Left Alignment */
    .page-title, .comparison-section h2, .faq-section h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--moonoh-dark);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .comparison-section p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Comparison Table (Airbnb Minimal Table) */
    .table-responsive-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius-airbnb);
      border: 1px solid var(--airbnb-border);
      box-shadow: var(--airbnb-shadow);
      background: #FFFFFF;
      margin-top: 16px;
    }
    .comparison-table {
      width: 100%;
      min-width: 540px;
      border-collapse: collapse;
      background: #FFFFFF;
    }
    .comparison-table th {
      background: #FAF9FF;
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 800;
      color: var(--moonoh-dark);
      border-bottom: 1px solid var(--airbnb-border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-align: left;
    }
    .comparison-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #F3F4F6;
      font-size: 13px;
      color: var(--text-main);
      white-space: nowrap;
    }
    .comparison-table tr:last-child td { border-bottom: none; }
    .comparison-table td strong { color: var(--moonoh-dark); font-weight: 700; }

    /* FAQ Airbnb Cards */
    .faq-item {
      padding: 24px 28px;
      margin-bottom: 16px;
    }
    .faq-item h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--moonoh-dark);
      margin: 0 0 8px 0;
    }
    .faq-item p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .footer-address { color: var(--text-muted); font-size: 13px; line-height: 1.6; margin-top: 10px; }

    /* Mobile Overrides */
    @media (max-width: 768px) {
      .hero-heading-left .container,
      .tldr-box,
      .comparison-section,
      .faq-section,
      .footer .columns,
      .page-container {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }
      .tldr-box, .team-circles, .comparison-section, .faq-section {
        margin-top: 36px !important;
        margin-bottom: 36px !important;
      }

      .tldr-box, .content-box, .faq-item {
        padding: 22px 18px !important;
        border-radius: 16px !important;
      }
      .hero-heading-left h1, .title-copy-goes-here-be-awesome {
        font-size: 26px !important;
        line-height: 1.25 !important;
      }
      .actions {
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        gap: 10px !important;
        flex-wrap: wrap !important;
      }
      .actions img, .appstore {
        max-width: 150px !important;
        height: auto !important;
      }
    }
  
    
    /* Mobile Navigation Fixes (<450px) */
    @media (max-width: 450px) {
      .navbar-content {
        position: relative !important;
        width: 100% !important;
        height: 64px !important; /* Fixed height for absolute centering */
        display: block !important;
      }
      .navbar .navbar-brand {
        position: absolute !important;
        left: 16px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        margin: 0 !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
        float: none !important;
      }
      .navbar .logo, .navbar .logo a {
        margin: 0 !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
      }
      .navbar .logo img, .navbar .vectors-wrapper-2 {
        display: block !important;
        max-width: 170px !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .navbar .w-nav-button {
        position: absolute !important;
        right: 16px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        background-color: transparent !important;
        padding: 0 !important;
        width: 48px !important;
        height: 48px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        float: none !important;
      }
      .navbar .w-nav-button.w--open {
        background-color: transparent !important;
      }
      
      /* Hamburger Menu Open State Styling */
      .navbar .w-nav-menu {
        background-color: #FAF9FF !important;
        box-shadow: 0 8px 24px rgba(0,0,0,0.1) !important;
        border-radius: 16px !important;
        padding: 20px !important;
        margin-top: 10px !important;
      }
      .w-nav-overlay {
        background: transparent !important;
        top: 64px !important; /* Start below navbar */
      }
      .navbar-link, .nav-link {
        font-family: "Open Sans", sans-serif !important;
        font-size: 18px !important;
        font-weight: 500 !important;
        color: #1A1A1A !important;
        padding: 16px 20px !important;
        text-align: center !important;
        display: block !important;
        transition: color 0.15s ease !important;
      }
      .navbar-link:hover, .navbar-link:focus, .nav-link:hover, .nav-link:focus {
        color: #4F46E5 !important;
        font-weight: 700 !important;
      }
      .navbar-link.w--current, .nav-link.w--current,
      .navbar-link[aria-current], .nav-link[aria-current] {
        color: #4F46E5 !important;
        font-weight: 700 !important;
      }
      .navbar .navbar-button {
        background-color: #2F3CFF !important;
        color: white !important;
        padding: 16px 24px !important;
        border-radius: 100px !important;
        margin-top: 16px !important;
        display: block !important;
        text-align: center !important;
      }
      .navbar .navbar-button .text, .navbar .navbar-button div {
        font-family: "Open Sans", sans-serif !important;
        font-size: 18px !important;
        font-weight: 800 !important;
        color: white !important;
      }
      
      /* Hamburger Icon toggles to X */
      .navbar .w-nav-button.w--open .w-icon-nav-menu {
        display: none !important;
      }
      @media (max-width: 479px) {
      .navbar .w-nav-button.w--open::after {
        content: "✕" !important;
        font-size: 32px !important;
        color: #1A1A1A !important;
        line-height: 1 !important;
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
      }
    }
    } /* Missing closing brace added here */
    
    /* Dynamic Item Grid & Modal CSS */
    .item-feed-section {
      max-width: var(--container-max-width) !important;
      margin: 96px auto 64px auto !important;
      padding: 0 20px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .item-feed-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--moonoh-dark);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }
    .item-card {
      background: transparent;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .item-card:hover {
      transform: translateY(-4px);
    }
                /* Unbreakable 1:1 Square Card Box CSS */
    .item-card-img-wrap {
      width: 100% !important;
      max-width: 100% !important;
      height: 0 !important;
      padding-bottom: 100% !important;
      position: relative !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      background-color: #F3F4F6 !important;
      margin-bottom: 8px !important;
      display: block !important;
    }
    .item-card-img-wrap img,
    .item-card-image,
    .item-card-img {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: cover !important;
      border-radius: 12px !important;
      display: block !important;
      margin: 0 !important;
    }
    .item-card-content,
    .item-card-info {
      padding: 4px 4px 0 4px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .item-card-price {
      font-weight: 800;
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .item-card-title {
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .item-card-location {
      font-size: 13px;
      color: #717171;
    }
    
    /* Location Dropdown */
    .location-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .location-select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    #location-select {
      appearance: none;
      -webkit-appearance: none;
      padding: 9px 36px 9px 16px;
      border-radius: 999px;
      border: 1.5px solid #3a46e2;
      font-size: 14px;
      font-weight: 600;
      color: #3a46e2;
      background: #EDEFFC;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      min-width: 180px;
    }
    #location-select:hover {
      background: #D9DCF9;
    }
    .location-select-caret {
      position: absolute;
      right: 12px;
      pointer-events: none;
      color: #4F46E5;
    }
    .location-count {
      font-size: 13px;
      color: #6B7280;
      font-weight: 500;
    }

    /* Filter Pills (Multi-line Wrap, Compact Size, 8px Vertical Gap) */
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      row-gap: 8px;
      column-gap: 10px;
      margin-bottom: 28px;
    }
    .filter-pill {
      white-space: nowrap;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #4B5563;
      background-color: #F9FAFB;
      border: 1px solid #E5E7EB;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-pill:focus {
      outline: none;
    }
    .filter-pill.active {
      background-color: #111827;
      color: #FFFFFF;
      border-color: #111827;
      font-weight: 600;
    }
    .filter-pill:hover:not(.active) {
      border-color: #9CA3AF;
      color: #111827;
      background-color: #F3F4F6;
    }
    .filter-pill-extra {
      display: none;
    }
    .filter-container.is-expanded .filter-pill-extra {
      display: inline-block;
    }
    .filter-pill-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .filter-container.is-expanded .filter-pill-more {
      border-color: #9CA3AF;
      color: #111827;
      background-color: #FFFFFF;
    }
    .more-cat-caret {
      transition: transform 0.2s ease;
    }
    .filter-container.is-expanded .more-cat-caret {
      transform: rotate(180deg);
    }
    
    /* Source Segment Switcher (Moonoh · Rescue · Local · Markets) */
    .source-segment-wrap {
      display: inline-flex;
      align-items: center;
      background-color: #F3F4F6;
      padding: 3px;
      border-radius: 999px;
      gap: 3px;
      border: 1px solid #E5E7EB;
      margin-left: auto;
      flex-shrink: 0;
    }
    .source-tab-btn {
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #6B7280;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
      text-decoration: none;

<script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=65e3de602f703e1765199b30" type="text/javascript"></script>

  <script>
    let allItems = [];
    let currentFiltered = [];
    let visibleCount = 40;

    const categoryMap = {
      "All": null,
      "Free": "FREE_FILTER",
      "Food & Groceries": "food",
      "Antiques & collections": "antique",
      "Baby & kids": "baby",
      "Arts, books, music, movies & tickets": "art",
      "Electronics & appliances": "electronics",
      "Furniture": "furniture",
      "Health & beauty": "health",
      "Shoes": "shoe",
      "Home, garden & DIY": "home",
      "Jewelry & watches": "jewelry",
      "Luggages & bags": "bag",
      "Men's fashion": "men",
      "Women's fashion": "women",
      "Pet supplies": "pet",
      "Sublets": "sublet",
      "Sports & leisure": "sport",
      "Toys & Games": "toy",
      "Other": "other"
    };

    function renderGrid(itemsToRender) {
      const grid = document.getElementById("moonoh-item-grid");
      const loadMoreContainer = document.getElementById("load-more-container");
      const countInfo = document.getElementById("item-count-info");
      if (!grid) return;

      if (!itemsToRender || itemsToRender.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#888; padding:40px; grid-column:1/-1;">No items found in this category.</p>';
        if (loadMoreContainer) loadMoreContainer.style.display = "none";
        return;
      }

      const visibleItems = itemsToRender.slice(0, visibleCount);
      let html = "";
      visibleItems.forEach(item => {
        if (!item) return;
        const itemTitle = item.title || 'Item';
        const safeTitle = itemTitle.replace(/'/g, "\\'");
        const formatPrice = (p) => (!p || p <= 0 ? "Free" : (p % 1 !== 0 ? "$" + p.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "$" + Math.round(p).toLocaleString()));
        const priceStr = formatPrice(item.price);
        const targetUrl = item.url || `/item/item-${item.no || item.id}`;
        const isExternal = item.source === 'karrot' || item.source === 'heykorean' || item.source === 'kimc';
        
        let badgeHtml = '';
        const sourceVal = (item.source || item.badgeName || '').toLowerCase();
        const shopId = (item.shop_id || '').toLowerCase();
        
        if (sourceVal === 'karrot' || shopId === 'karrot') {
          badgeHtml = `<div class="item-card-badge badge-karrot">Karrot</div>`;
        } else if (sourceVal === 'heykorean' || shopId === 'heykorean') {
          badgeHtml = `<div class="item-card-badge badge-heykorean">HeyKorean</div>`;
        } else if (sourceVal === 'kimc' || sourceVal === 'food-rescue' || shopId === 'kimc') {
          badgeHtml = `<div class="item-card-badge badge-kimc">Kim'C Market</div>`;
        } else if (sourceVal.includes('happier') || shopId.includes('happier') || item.badgeName === 'Happier Grocery') {
          badgeHtml = `<div class="item-card-badge badge-happier">Happier Grocery</div>`;
        } else if (sourceVal.includes('pop') || shopId.includes('pop') || item.badgeName === 'Pop Up Grocer') {
          badgeHtml = `<div class="item-card-badge badge-popup">Pop Up Grocer</div>`;
        } else if (sourceVal.includes('big') || shopId.includes('big') || item.badgeName === 'Big Night') {
          badgeHtml = `<div class="item-card-badge badge-bignight">Big Night</div>`;
        } else if (sourceVal === 'external' || sourceVal === 'others') {
          badgeHtml = `<div class="item-card-badge badge-heykorean">Marketplace</div>`;
        } else {
          badgeHtml = `<div class="item-card-badge badge-moonoh">Moonoh</div>`;
        }

        function generateExternalSlug(t, l, id) {
          let clean = (t || 'item').toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-');
          if (clean.length > 50) clean = clean.substring(0, 50).replace(/-$/, '');
          let loc = 'nyc-ny';
          if (l) {
            let low = String(l).toLowerCase();
            if (low.includes('bayside')) loc = 'bayside-queens-ny';
            else if (low.includes('flushing')) loc = 'flushing-queens-ny';
            else if (low.includes('astoria')) loc = 'astoria-queens-ny';
            else if (low.includes('queens')) loc = 'queens-ny';
            else if (low.includes('brooklyn')) loc = 'brooklyn-ny';
            else if (low.includes('manhattan')) loc = 'manhattan-ny';
            else if (low.includes('palisades')) loc = 'palisades-park-nj';
            else if (low.includes('fort lee')) loc = 'fort-lee-nj';
          }
          return `/item/${clean}-${loc}-ext-${id}`;
        }

        const extSlug = isExternal ? generateExternalSlug(itemTitle, item.location || item.rawTown, item.id) : targetUrl;
        const clickAttr = `href="${extSlug}"`;
        const imgSrc = item.image || item.photo || '/images/default-item-placeholder.png';
        const rawLoc = item.location || item.rawTown || 'NYC';
        const itemLoc = item.timeAgo ? `${item.timeAgo} · ${rawLoc}` : rawLoc;

        html += `
        <a class="item-card" ${clickAttr} style="text-decoration:none; color:inherit;">
          <div class="item-card-img-wrap">
            <img src="${imgSrc}" alt="${safeTitle}" class="item-card-image" loading="lazy" onerror="this.onerror=null; this.src='/images/default-item-placeholder.png';">
          </div>
          <div class="item-card-content">
            <div class="item-card-price">${priceStr}</div>
            <div class="item-card-title">${itemTitle}</div>
            <div class="item-card-location">${itemLoc}</div>
            ${badgeHtml}
          </div>
        </a>
        `;
      });
      grid.innerHTML = html;

      if (loadMoreContainer) {
        if (itemsToRender.length > visibleCount) {
          loadMoreContainer.style.display = "block";
          if (countInfo) {
            countInfo.innerText = `Showing ${visibleItems.length} of ${itemsToRender.length} items`;
          }
        } else {
          loadMoreContainer.style.display = "none";
        }
      }
    }

    async function renderItems() {
      const grid = document.getElementById("moonoh-item-grid");
      if (!grid) return;
      
      try {
        let items = [];
        if (window.__INITIAL_ITEMS__ && Array.isArray(window.__INITIAL_ITEMS__) && window.__INITIAL_ITEMS__.length > 0) {
          items = window.__INITIAL_ITEMS__.map(raw => ({
            no: raw.id,
            id: raw.id,
            title: raw.title,
            price: raw.price,
            image: raw.photo,
            location: raw.townName,
            rawTown: raw.rawTown || raw.townName || '',
            category: raw.categoryName,
            url: raw.detailUrl,
            source: raw.source || 'external'
          }));
        }

        if (!Array.isArray(items) || items.length === 0) {
          try {
            const res = await fetch('/api/items');
            items = await res.json();
          } catch (e) {}
        }
        
        items = (Array.isArray(items) ? items : []).filter(item => item && item.image && !item.image.includes("ico_profile_empty.png"));
        allItems = items;
        currentFiltered = items;
        visibleCount = 40;
        
        applyFilters(getActiveCategoryKeyword());

        // Fetch fresh items from API to ensure app uploads are always up-to-date
        fetchFreshItems();
      } catch (e) {
        console.error("Error loading items:", e);
      }
    }

    async function fetchFreshItems() {
      // Do not overwrite pre-filtered SSR items on aggregation routes (/explore/{region}/{category})
      const isAggregatedRoute = window.location.pathname !== '/explore' && window.location.pathname !== '/explore/';
      if (isAggregatedRoute && window.__INITIAL_ITEMS__) {
        return;
      }
      try {
        const res = await fetch('/api/items?t=' + Date.now());
        const freshItems = await res.json();
        if (Array.isArray(freshItems) && freshItems.length > 0) {
          const valid = freshItems.filter(item => item && item.image && !item.image.includes("ico_profile_empty.png"));
          const oldTop = allItems.length > 0 ? allItems[0].no : 0;
          const newTop = valid.length > 0 ? valid[0].no : 0;

          allItems = valid;
          if (oldTop !== newTop || currentFiltered.length === 0) {
            applyFilters(getActiveCategoryKeyword());
          }
        }
      } catch (e) {}
    }

    function startAutoRefresh() {
      // Auto-poll every 15 seconds so app uploads appear automatically without manual refresh
      setInterval(fetchFreshItems, 15000);
    }

    // Borough keyword mapping - maps dropdown value to keywords found in rawTown or location
    const boroughKeywords = {
      'Manhattan': ['manhattan', 'all manhattan', 'new york', 'nyc', 'ny, ny', 'upper east', 'upper west', 'downtown manhattan', 'midtown', 'harlem', 'tribeca', 'soho', 'lower east', 'east village', 'west village', 'chelsea', 'gramercy', 'inwood', 'washington heights', 'morningside', 'financial district', 'wall street', 'murray hill', 'kips bay', 'hell', 'flatiron'],
      'Queens': ['queens', 'bayside', 'flushing', 'astoria', 'jamaica', 'forest hills', 'jackson heights', 'woodside', 'ridgewood', 'ozone park', 'fresh meadows', 'corona', 'elmhurst', 'sunnyside', 'long island city', 'rego park', 'maspeth', 'howard beach', 'far rockaway', 'college point', 'whitestone', 'douglaston'],
      'Brooklyn': ['brooklyn', 'park slope', 'williamsburg', 'bushwick', 'bed stuy', 'flatbush', 'crown heights', 'bay ridge', 'bensonhurst', 'canarsie', 'east new york', 'greenpoint', 'cobble hill', 'carroll gardens', 'boerum', 'sunset park', 'borough park', 'brighton beach', 'coney island', 'sheepshead', 'ditmas'],
      'Bronx': ['bronx'],
      'Staten Island': ['staten island'],
      'Bergen': ['bergen', 'hackensack', 'paramus', 'fort lee', 'englewood', 'teaneck', 'palisades', 'fair lawn', 'garfield', 'ridgewood nj', 'rutherford'],
      'Hudson': ['hudson', 'jersey city', 'hoboken', 'bayonne', 'weehawken', 'union city', 'north bergen', 'secaucus', 'kearny'],
    };

    // Active town and source filter state
    let activeTown = ''; // '' = all areas
    let activeSource = 'moonoh'; // 'moonoh' (default for user main page) or 'others'
    let externalItemsList = [];

    function applyFilters(categoryKeyword = null) {
      let filtered = activeSource === 'others' ? externalItemsList : allItems;

      // Filter by town if selected
      if (activeTown && boroughKeywords[activeTown]) {
        const kws = boroughKeywords[activeTown];
        filtered = filtered.filter(item => {
          const locStr = ((item.rawTown || '') + ' ' + (item.location || '')).toLowerCase();
          return kws.some(kw => locStr.includes(kw));
        });
      }

      // Filter by category if selected
      if (categoryKeyword === "FREE_FILTER") {
        filtered = filtered.filter(item => item && item.price === 0);
      } else if (categoryKeyword) {
        const kw = String(categoryKeyword).toLowerCase();
        filtered = filtered.filter(item => {
          if (!item) return false;
          const cat = String(item.category || item.categoryName || '').toLowerCase();
          const title = String(item.title || '').toLowerCase();
          return cat.includes(kw) || kw.includes(cat) || (kw.length >= 3 && title.includes(kw));
        });
      }

      currentFiltered = filtered;
      visibleCount = 40;
      renderGrid(currentFiltered);
      updateLocationCount(filtered.length);
    }

    function updateLocationCount(count) {
      const countEl = document.getElementById('location-count');
      if (countEl) {
        countEl.textContent = count > 0 ? `${count} items` : 'No items';
      }
    }

    function getActiveCategoryKeyword() {
      const activeBtn = document.querySelector('.filter-pill.active');
      if (!activeBtn) return null;
      const label = activeBtn.textContent.trim();
      return categoryMap[label] !== undefined ? categoryMap[label] : null;
    }

    // Pill label → URL category slug mapping
    const pillLabelToSlug = {
      'All': null,
      'Free': null, // free is not an SSR category slug, handle separately
      'Food & Groceries': 'food-groceries',
      'Furniture': 'furniture',
      'Electronics & Appliances': 'electronics',
      'Health & beauty': 'health-beauty',
      "Women's fashion": 'womens-fashion',
      "Men's fashion": 'mens-fashion',
      'Shoes': 'shoes',
      'Baby & kids': 'baby-kids',
      'Sports & leisure': 'sports-leisure',
      'Toys & Games': 'toys-games',
      'Home, garden & DIY': 'home-garden',
      'Jewelry & watches': 'jewelry-watches',
      'Luggages & bags': 'luggages-bags',
      'Arts, books, music, movies & tickets': 'arts-books-music',
      'Pet supplies': 'pet-supplies',
      'Other': null
    };

    
    const pillSlugToLabel = {
      'food-groceries': 'Food & Groceries',
      'furniture': 'Furniture',
      'electronics': 'Electronics & Appliances',
      'health-beauty': 'Health & beauty',
      'womens-fashion': "Women's fashion",
      'mens-fashion': "Men's fashion",
      'shoes': 'Shoes',
      'baby-kids': 'Baby & kids',
      'sports-leisure': 'Sports & leisure',
      'toys-games': 'Toys & Games',
      'home-garden': 'Home, garden & DIY',
      'jewelry-watches': 'Jewelry & watches',
      'luggages-bags': 'Luggages & bags',
      'arts-books-music': 'Arts, books, music, movies & tickets',
      'pet-supplies': 'Pet supplies'
    };

    function initCategoryFromUrl() {
      const params = new URLSearchParams(window.location.search);
      let catParam = params.get('category') || params.get('cat') || params.get('c');
      
      const pathname = window.location.pathname.toLowerCase();
      const parts = pathname.replace(/^\/explore\/?/, '').split('/').filter(Boolean);
      let pathCatSlug = null;
      if (parts.length === 1 && pillSlugToLabel[parts[0]]) {
        pathCatSlug = parts[0];
      } else if (parts.length >= 2 && pillSlugToLabel[parts[1]]) {
        pathCatSlug = parts[1];
      }

      let targetLabel = null;
      if (catParam) {
        let clean = decodeURIComponent(catParam).trim().toLowerCase();
        document.querySelectorAll('.filter-pill:not(.filter-pill-more)').forEach(btn => {
          let label = btn.textContent.trim();
          let lowLabel = label.toLowerCase();
          let slug = pillLabelToSlug[label];
          if (clean === lowLabel || clean === slug || clean.includes(lowLabel) || lowLabel.includes(clean) || (clean.includes('bag') && lowLabel.includes('bag'))) {
            targetLabel = label;
          }
        });
      } else if (pathCatSlug && pillSlugToLabel[pathCatSlug]) {
        targetLabel = pillSlugToLabel[pathCatSlug];
      }

      if (targetLabel) {
        document.querySelectorAll('.filter-pill:not(.filter-pill-more)').forEach(b => {
          if (b.textContent.trim().toLowerCase() === targetLabel.toLowerCase()) {
            b.classList.add('active');
          } else {
            b.classList.remove('active');
          }
        });
        const keyword = categoryMap[targetLabel];
        applyFilters(keyword !== undefined ? keyword : null);
      }
    }

    function setupFilters() {
      // Category pill clicks (exclude More Categories button from active state toggle)
      document.querySelectorAll('.filter-pill:not(.filter-pill-more)').forEach(btn => {
        btn.addEventListener('click', function() {
          const label = this.textContent.trim();
          const _p1 = window.location.pathname;
          const _stripped1 = _p1.startsWith('/explore') ? _p1.slice('/explore'.length).replace(/^\//, '') : _p1;
          const isAggregationPage = _stripped1.split('/').filter(Boolean).length >= 1
            && window.__INITIAL_ITEMS__ != null;
          if (isAggregationPage) {
            const currentSegments = _stripped1.split('/').filter(Boolean);
            const currentRegionSlug = currentSegments.length >= 1 ? currentSegments[0] : '';
            const newCatSlug = pillLabelToSlug[label];
            if (label === 'All' && currentRegionSlug) {
              window.location.href = `/explore/${currentRegionSlug}`;
              return;
            }
            if (newCatSlug && currentRegionSlug) {
              window.location.href = `/explore/${currentRegionSlug}/${newCatSlug}`;
              return;
            }
            if (newCatSlug && !currentRegionSlug) {
              window.location.href = `/explore/${newCatSlug}`;
              return;
            }
            // For Free / Other just fall through to client-side
          }
          document.querySelectorAll('.filter-pill:not(.filter-pill-more)').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const keyword = categoryMap[label];
          applyFilters(keyword !== undefined ? keyword : null);
        });
      });

      // Location dropdown
      // On aggregation pages (/explore/{region}/{category}), changing location navigates to new URL.
      // On the main /explore page, it filters client-side.
      const locationSelect = document.getElementById('location-select');
      const regionToSlug = {
        'Manhattan': 'manhattan',
        'Bronx': 'bronx',
        'Brooklyn': 'brooklyn',
        'Queens': 'queens',
        'Staten Island': 'staten-island',
        'Bergen': 'bergen-county',
        'Hudson': 'hudson-county'
      };
      if (locationSelect) {
        locationSelect.addEventListener('change', function() {
          const _p2 = window.location.pathname;
          const _stripped2 = _p2.startsWith('/explore') ? _p2.slice('/explore'.length).replace(/^\//, '') : _p2;
          const isAggregationPage = _stripped2.split('/').filter(Boolean).length >= 1
            && window.__INITIAL_ITEMS__ != null;
          if (isAggregationPage) {
            // Navigate to correct URL for this region+category combo
            const newRegionSlug = regionToSlug[this.value];
            const currentSegments = _stripped2.split('/').filter(Boolean);
            const currentCategorySlug = currentSegments.length >= 2 ? currentSegments[1] : (currentSegments[0] || '');
            if (newRegionSlug && currentCategorySlug) {
              window.location.href = `/explore/${newRegionSlug}/${currentCategorySlug}`;
            } else if (newRegionSlug) {
              window.location.href = `/explore/${newRegionSlug}`;
            } else {
              window.location.href = '/explore';
            }
            return;
          }
          activeTown = this.value;
          applyFilters(getActiveCategoryKeyword());
        });
      }

      let activePath = window.location.pathname.toLowerCase();
      let _pSegments = activePath.replace(/^\/explore\/?/, '').split('/').filter(Boolean);
      let isCombinedPage = _pSegments.length >= 1 && !['food-rescue', 'foodrescue', 'local-shops', 'localshops', 'local', 'marketplaces', 'others'].includes(_pSegments[0]);
      let activeSource = isCombinedPage ? 'all' : 'moonoh';

      if (activePath.includes('food-rescue') || activePath.includes('foodrescue')) {
        activeSource = 'foodrescue';
      } else if (activePath.includes('local-shops') || activePath.includes('localshops') || activePath.includes('local')) {
        activeSource = 'localshops';
      } else if (activePath.includes('marketplaces') || activePath.includes('others')) {
        activeSource = 'marketplaces';
      }

      const sourceSegmentWrap = document.getElementById('source-segment-wrap');
      if (isCombinedPage && sourceSegmentWrap) {
        sourceSegmentWrap.style.display = 'none';
      }

      // Source Segment Switcher (Moonoh · Food Rescue · Local Shops · Marketplaces)
      const btnMoonoh = document.getElementById('tab-source-moonoh');
      const btnFoodRescue = document.getElementById('tab-source-foodrescue');
      const btnLocalShops = document.getElementById('tab-source-localshops');
      const btnMarketplaces = document.getElementById('tab-source-marketplaces');
      const foodRescueBanner = document.getElementById('food-rescue-banner');
      
      let foodRescueItemsList = [];

      async function preloadFoodRescueItems() {
        if (foodRescueItemsList.length === 0) {
          if (window.__INITIAL_FOOD_RESCUE__ && Array.isArray(window.__INITIAL_FOOD_RESCUE__) && window.__INITIAL_FOOD_RESCUE__.length > 0) {
            foodRescueItemsList = window.__INITIAL_FOOD_RESCUE__.map(raw => ({
              no: raw.id || raw.no,
              id: raw.id || raw.no,
              title: raw.title,
              price: raw.price,
              image: raw.photo || raw.image,
              photo: raw.photo || raw.image,
              location: raw.townName || raw.location,
              rawTown: raw.rawTown || raw.townName || raw.location || '',
              category: raw.categoryName || raw.category || 'Food & Groceries',
              categoryName: raw.categoryName || raw.category || 'Food & Groceries',
              url: raw.detailUrl || raw.url,
              source: 'kimc',
              timeAgo: raw.timeAgo || 'Food Rescue'
            }));
            if (activeSource === 'foodrescue') {
              applyFilters(getActiveCategoryKeyword());
            }
            return;
          }

          try {
            let res = await fetch('/api/food-rescue');
            if (!res.ok) res = await fetch('/.netlify/functions/food-rescue-items');
            const data = await res.json();
            if (Array.isArray(data)) {
              foodRescueItemsList = data.map(raw => ({
                no: raw.id,
                id: raw.id,
                title: raw.title,
                price: raw.price,
                image: raw.image,
                photo: raw.image,
                location: raw.location,
                rawTown: raw.rawTown || raw.location || '',
                category: raw.categoryName || raw.category || 'Food & Groceries',
                categoryName: raw.categoryName || raw.category || 'Food & Groceries',
                url: raw.detailUrl || raw.url,
                source: 'kimc',
                timeAgo: raw.timeAgo || 'Food Rescue'
              }));
            }
            if (activeSource === 'foodrescue') {
              applyFilters(getActiveCategoryKeyword());
            }
          } catch (e) {
            console.error("Error loading Food Rescue items:", e);
          }
        }
      }

      async function preloadExternalItems() {
        if (externalItemsList.length === 0) {
          if (window.__INITIAL_EXTERNAL_ITEMS__ && Array.isArray(window.__INITIAL_EXTERNAL_ITEMS__) && window.__INITIAL_EXTERNAL_ITEMS__.length > 0) {
            externalItemsList = window.__INITIAL_EXTERNAL_ITEMS__.map(raw => ({
              no: raw.id || raw.no,
              id: raw.id || raw.no,
              title: raw.title,
              price: raw.price,
              image: raw.photo || raw.image,
              photo: raw.photo || raw.image,
              location: raw.townName || raw.location,
              rawTown: raw.rawTown || raw.townName || raw.location || '',
              category: raw.categoryName || raw.category,
              categoryName: raw.categoryName || raw.category,
              source: raw.source || 'external',
              timeAgo: raw.timeAgo || ''
            }));
            if (activeSource === 'marketplaces' || activeSource === 'others') {
              applyFilters(getActiveCategoryKeyword());
            }
            return;
          }

          try {
            let res = await fetch('/api/external-items');
            if (!res.ok) res = await fetch('/.netlify/functions/external-items');
            const data = await res.json();
            if (Array.isArray(data)) {
              externalItemsList = data.map(raw => ({
                no: raw.id,
                id: raw.id,
                title: raw.title,
                price: raw.price,
                image: raw.image,
                photo: raw.image,
                location: raw.location,
                rawTown: raw.rawTown || raw.location || '',
                category: raw.category,
                categoryName: raw.category,
                source: raw.source || 'external',
                timeAgo: raw.timeAgo || ''
              }));
            }
            if (activeSource === 'marketplaces' || activeSource === 'others') {
              applyFilters(getActiveCategoryKeyword());
            }
          } catch (e) {
            console.error("Error loading external items:", e);
          }
        }
      }
      preloadFoodRescueItems();
      preloadExternalItems();

      // Override applyFilters to handle foodrescue source
      const origApplyFilters = applyFilters;
      let localShopsItemsList = [];
      async function preloadLocalShopsItems() {
        if (localShopsItemsList.length > 0) return;
        try {
          const res = await fetch('/local_shops_data.json');
          if (res.ok) {
            const data = await res.json();
            localShopsItemsList = (data.products || []).map(p => ({
              id: p.id,
              no: p.id,
              title: p.title,
              price: p.current_price,
              photo: p.image_source_url,
              image: p.image_source_url,
              townName: p.availability_context || 'NYC',
              rawTown: 'NYC',
              location: 'NYC',
              category: p.moonoh_category || 'Grocery',
              categoryName: p.moonoh_category || 'Grocery',
              source: p.shop_id,
              shop_id: p.shop_id,
              badgeName: p.brand || (data.shops && data.shops[p.shop_id] ? data.shops[p.shop_id].name : 'Local Shop'),
              url: `/local-product/${p.shop_id}/${p.slug}`
            }));
          }
        } catch (e) {}
      }

      applyFilters = function(categoryKeyword = null) {
        let filtered = allItems;
        if (activeSource === 'foodrescue') {
          filtered = foodRescueItemsList;
        } else if (activeSource === 'localshops') {
          filtered = localShopsItemsList;
        } else if (activeSource === 'marketplaces' || activeSource === 'others') {
          filtered = externalItemsList;
        } else if (activeSource === 'all') {
          filtered = [...allItems, ...foodRescueItemsList, ...localShopsItemsList, ...externalItemsList];
        } else {
          filtered = allItems.filter(i => !i.source || i.source === 'moonoh');
        }

        if (activeTown && boroughKeywords[activeTown]) {
          const kws = boroughKeywords[activeTown];
          filtered = filtered.filter(item => {
            if (item.source === 'kimc') return true; // Kim'C Market ships across all NYC & NJ
            const locStr = ((item.rawTown || '') + ' ' + (item.location || '')).toLowerCase();
            return kws.some(kw => locStr.includes(kw));
          });
        }

        if (activeSource !== 'foodrescue') {
          if (categoryKeyword === "FREE_FILTER") {
            filtered = filtered.filter(item => item.price === 0);
          } else if (categoryKeyword) {
            filtered = filtered.filter(item => {
              const cat = (item.category || item.categoryName || '').toLowerCase();
              if (categoryKeyword === 'food') {
                return cat.includes('food') || cat.includes('groceries');
              }
              return cat.includes(categoryKeyword.toLowerCase());
            });
          }
        }

        // Sort combined items by original posting timestamp (recency order), NOT grouped by shop order
        filtered.sort((a, b) => (b.postedAt || 0) - (a.postedAt || 0));

        currentFiltered = filtered;
        visibleCount = 40;
        renderGrid(currentFiltered);
        updateLocationCount(filtered.length);
      };

      async function switchSource(source) {
        activeSource = source;
        const btnMoonoh = document.getElementById('tab-source-moonoh');
        const btnFoodRescue = document.getElementById('tab-source-foodrescue');
        const btnLocalShops = document.getElementById('tab-source-localshops');
        const btnMarketplaces = document.getElementById('tab-source-marketplaces');

        if (btnMoonoh) btnMoonoh.classList.toggle('active', source === 'moonoh');
        if (btnFoodRescue) btnFoodRescue.classList.toggle('active', source === 'foodrescue');
        if (btnLocalShops) btnLocalShops.classList.toggle('active', source === 'localshops');
        if (btnMarketplaces) btnMarketplaces.classList.toggle('active', source === 'marketplaces' || source === 'others');

        const subtitleLabel = document.getElementById('section-subtitle-label');
        if (subtitleLabel) {
          if (source === 'foodrescue') subtitleLabel.textContent = "Food Rescue";
          else if (source === 'localshops') subtitleLabel.textContent = "Local";
          else if (source === 'marketplaces' || source === 'others') subtitleLabel.textContent = "Other Marketplaces";
          else subtitleLabel.textContent = "Moonoh Marketplace";
        }

        const foodRescueBanner = document.getElementById("food-rescue-banner");
        if (foodRescueBanner) {
          foodRescueBanner.style.display = source === 'foodrescue' ? 'flex' : 'none';
        }

        const filterContainer = document.getElementById("filter-container");
        if (filterContainer) {
          filterContainer.style.display = (source === 'foodrescue' || source === 'localshops') ? 'none' : 'flex';
        }

        // Apply filter instantly on current memory pool
        applyFilters(getActiveCategoryKeyword());

        // Fetch in background if missing
        if (source === 'foodrescue' && foodRescueItemsList.length === 0) {
          preloadFoodRescueItems().then(() => {
            if (activeSource === 'foodrescue') applyFilters(getActiveCategoryKeyword());
          });
        } else if (source === 'localshops' && localShopsItemsList.length === 0) {
          preloadLocalShopsItems().then(() => {
            if (activeSource === 'localshops') applyFilters(getActiveCategoryKeyword());
          });
        } else if ((source === 'marketplaces' || source === 'others') && externalItemsList.length === 0) {
          preloadExternalItems().then(() => {
            if (activeSource === 'marketplaces' || activeSource === 'others') applyFilters(getActiveCategoryKeyword());
          });
        }
      }

      const tabBtnMoonoh = document.getElementById('tab-source-moonoh');
      const tabBtnFoodRescue = document.getElementById('tab-source-foodrescue');
      const tabBtnLocalShops = document.getElementById('tab-source-localshops');
      const tabBtnMarketplaces = document.getElementById('tab-source-marketplaces');

      if (tabBtnMoonoh) tabBtnMoonoh.addEventListener('click', (e) => { e.preventDefault(); switchSource('moonoh'); history.pushState(null, '', '/explore'); });
      if (tabBtnFoodRescue) tabBtnFoodRescue.addEventListener('click', (e) => { e.preventDefault(); switchSource('foodrescue'); history.pushState(null, '', '/explore/food-rescue'); });
      if (tabBtnLocalShops) tabBtnLocalShops.addEventListener('click', (e) => { e.preventDefault(); switchSource('localshops'); history.pushState(null, '', '/explore/local-shops'); });
      if (tabBtnMarketplaces) tabBtnMarketplaces.addEventListener('click', (e) => { e.preventDefault(); switchSource('marketplaces'); history.pushState(null, '', '/explore/marketplaces'); });

      const currentPath = window.location.pathname.toLowerCase();
      if (currentPath.includes('/explore/marketplaces') || currentPath.includes('/explore/others')) {
        switchSource('marketplaces');
      } else if (currentPath.includes('/explore/food-rescue')) {
        switchSource('foodrescue');
      } else if (currentPath.includes('/explore/local')) {
        switchSource('localshops');
      } else if (activeSource !== 'moonoh') {
        switchSource(activeSource);
      }

      // Load more
      // More Categories toggle button
      const btnMore = document.getElementById("btn-more-categories");
      const btnMoreText = document.getElementById("btn-more-text");
      const filterContainer = document.getElementById("filter-container");
      if (btnMore && filterContainer) {
        btnMore.addEventListener("click", function() {
          const isExpanded = filterContainer.classList.toggle("is-expanded");
          if (btnMoreText) btnMoreText.textContent = isExpanded ? "Less" : "More Categories";
        });
      }

      const btnLoadMore = document.getElementById("btn-load-more");
      if (btnLoadMore) {
        btnLoadMore.addEventListener("click", () => {
          visibleCount += 40;
          renderGrid(currentFiltered);
        });
      }

      // Read URL path segments and query params (SEO URLs & Breadcrumbs)
      // Path format: /explore/{category} or /explore/{geo}/{category}
      const pathSegments = window.location.pathname.replace(/^\/explore\/?/, '').split('/').filter(Boolean);
      const params = new URLSearchParams(window.location.search);
      
      let urlSource = params.get('source') || '';
      let urlTown = params.get('town') || '';
      let urlCategory = params.get('category') || '';

      if (urlSource === 'others') {
        switchSource('others');
      }

      if (pathSegments.length === 1) {
        urlCategory = urlCategory || pathSegments[0];
      } else if (pathSegments.length >= 2) {
        urlTown = urlTown || pathSegments[0];
        urlCategory = urlCategory || pathSegments[1];
      }

      // Highlight dropdown & filter pills based on URL without breaking SSR grid
      if (urlTown && locationSelect) {
        const opts = Array.from(locationSelect.options);
        const matched = opts.find(o => urlTown.toLowerCase().includes(o.value.toLowerCase()) && o.value !== '');
        if (matched) {
          locationSelect.value = matched.value;
          activeTown = matched.value;
        }
      }

      if (urlCategory && urlCategory.toLowerCase() !== 'others' && urlCategory.toLowerCase() !== 'external') {
        const urlCatLower = urlCategory.toLowerCase();
        let matchedBtn = null;
        document.querySelectorAll('.filter-pill').forEach(btn => {
          const label = btn.textContent.trim().toLowerCase();
          if (label !== 'other' && (urlCatLower.includes(label.split(' ')[0]) || label.includes(urlCatLower.split(' ')[0]))) {
            if (!matchedBtn) matchedBtn = btn;
          }
        });
        if (matchedBtn) {
          document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
          matchedBtn.classList.add('active');
          if (matchedBtn.classList.contains('filter-pill-extra') && filterContainer) {
            filterContainer.classList.add('is-expanded');
            if (btnMoreText) btnMoreText.textContent = "Less";
          }
        }
      }
    }

    // Modal Logic
    function openExternalModal(e, title, price, location, image, source, url) {
      if (e) e.preventDefault();
      
      const nativeView = document.getElementById("modal-view-native");
      const extView = document.getElementById("modal-view-external");
      const modal = document.getElementById("moonoh-download-modal");
      
      if (nativeView) nativeView.style.display = "none";
      if (extView) extView.style.display = "block";
      
      const imgEl = document.getElementById("modal-ext-image");
      const priceEl = document.getElementById("modal-ext-price");
      const titleEl = document.getElementById("modal-ext-title");
      const locEl = document.getElementById("modal-ext-location");
      const btn = document.getElementById("modal-ext-btn");
      const btnText = document.getElementById("modal-ext-btn-text");

      if (imgEl) imgEl.src = image;
      if (priceEl) priceEl.textContent = price;
      if (titleEl) titleEl.textContent = title;
      if (locEl) locEl.textContent = location;
      
      const sourceName = source === "heykorean" ? "HeyKorean" : "Karrot";
      if (btnText) btnText.innerHTML = `View on ${sourceName} &#8599;`;
      if (btn) btn.href = url;
      
      if (modal) modal.classList.add("active");
    }

    function openModal(itemName) {
      const nativeView = document.getElementById("modal-view-native");
      const extView = document.getElementById("modal-view-external");
      const modal = document.getElementById("moonoh-download-modal");
      
      if (nativeView) nativeView.style.display = "block";
      if (extView) extView.style.display = "none";
      
      const nameEl = document.getElementById("modal-item-name");
      if (nameEl) nameEl.innerText = itemName;
      if (modal) modal.classList.add("active");
    }
    
    function closeModal() {
      document.getElementById("moonoh-download-modal").classList.remove("active");
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", () => {
      renderItems();
      setupFilters();
      initCategoryFromUrl();
      startAutoRefresh();

      const modal = document.getElementById("moonoh-download-modal");
      if (modal) {
        modal.addEventListener("click", function(e) {
          if (e.target === this) closeModal();
        });
      }
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
      document.querySelectorAll('.navbar-link, .nav-link').forEach(link => {
        const href = link.getAttribute('href');
        if (href) {
          const cleanHref = href.replace(/\/$/, '') || '/';
          const isCurrent = (cleanHref === '/' && currentPath === '/') || (cleanHref !== '/' && currentPath === cleanHref) || (cleanHref !== '/' && cleanHref !== '/explore' && currentPath.startsWith(cleanHref));
          link.classList.toggle('w--current', isCurrent);
          if (isCurrent) {
            link.setAttribute('aria-current', 'page');
            link.style.setProperty('color', '#4F46E5', 'important');
            link.style.setProperty('font-weight', '700', 'important');
          } else {
            link.removeAttribute('aria-current');
            link.style.setProperty('color', '#1A1A1A', 'important');
            link.style.setProperty('font-weight', '500', 'important');
          }
        }
      });
    });
  </script>
