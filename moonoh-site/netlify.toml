[build]
  publish = "."

# 301 Domain Canonicalization (www -> non-www)
[[redirects]]
  from = "https://www.moon-oh.com/*"
  to = "https://moon-oh.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.moon-oh.com/*"
  to = "https://moon-oh.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://moon-oh.com/*"
  to = "https://moon-oh.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/food-rescue"
  to = "/.netlify/functions/food-rescue-items"
  status = 200

[[redirects]]
  from = "/api/external-items"
  to = "/.netlify/functions/external-items"
  status = 200

[[redirects]]
