[build]
  publish = "."

# 301 Domain Canonicalization (www -> non-www)
[[redirects]]
  from = "https://www.moon-oh.com/*"
  to = "https://moon-oh.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.moon-oh.com/*"
  to = "https://moon-oh.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://moon-oh.com/*"
  to = "https://moon-oh.com/:splat"
  status = 301
  force = true

# App & Function Routes
[[redirects]]
  from = "/api/external-items"
  to = "/.netlify/functions/external-items"
  status = 200

[[redirects]]
  from = "/api/items"
  to = "/.netlify/functions/items"
  status = 200

[[redirects]]
  from = "/item/*"
  to = "/.netlify/functions/item-detail"
  status = 200

[[redirects]]
  from = "/image-proxy/*"
  to = "http://52.44.113.58:8080/file/:splat"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/press"
  to = "/press.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/fraud-prevention"
  to = "/fraud-prevention.html"
  status = 200

[[redirects]]
  from = "/explore"
  to = "/.netlify/functions/explore"
  status = 200
  force = true

# /explore/queens, /explore/queens/furniture etc:
# Static index.html files take priority (Netlify serves them directly);
# if no static file exists, fall through to the explore function.
[[redirects]]
  from = "/explore/*"
  to = "/.netlify/functions/explore"
  status = 200
